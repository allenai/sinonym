name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel older in-flight runs for the same PR/branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies (dev group)
        run: uv sync --group dev

      - name: Build package (sdist + wheel)
        run: uv build

      - name: Validate package metadata (twine check)
        run: uvx twine check dist/*

      - name: Check test status against baseline
        run: uv run python scripts/check_test_status.py

      - name: Test import from sdist
        run: |
          artifact="$(realpath dist/*.tar.gz)"
          cd /tmp
          uv run --no-project --isolated --with "$artifact" python - <<'PY'
          import importlib.util

          from sinonym import ChineseNameDetector

          for module in ("joblib", "requests", "sklearn", "scipy", "skops"):
              assert importlib.util.find_spec(module) is None, module
          assert ChineseNameDetector().normalize_name("\u738b\u4f1f").result == "Wei Wang"
          print("sdist runtime smoke passed without training dependencies")
          PY

      - name: Test import from wheel + packaged resources
        run: |
          artifact="$(realpath dist/*.whl)"
          cd /tmp
          uv run --no-project --isolated --with "$artifact" python - <<'PY'
          import importlib.resources as resources
          import importlib.util

          from sinonym import ChineseNameDetector

          for module in ("joblib", "requests", "sklearn", "scipy", "skops"):
              assert importlib.util.find_spec(module) is None, module
          data_files = {path.name for path in resources.files("sinonym.data").iterdir()}
          assert "chinese_japanese_classifier.skops" in data_files
          assert "chinese_japanese_classifier.joblib" not in data_files
          assert ChineseNameDetector().normalize_name("\u738b\u4f1f").result == "Wei Wang"
          print("wheel runtime smoke passed without training dependencies")
          PY
